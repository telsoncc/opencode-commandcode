name: Catalog break
description: Model catalog extraction failed in CI
title: "[catalog-break] command-code@ — model extraction failed"
labels:
  - catalog-break
  - automation
body:
  - type: input
    id: command_code_version
    attributes:
      label: command-code version
      placeholder: "1.39.0"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Extraction error
    validations:
      required: true
  - type: input
    id: workflow_url
    attributes:
      label: Workflow run URL
  - type: markdown
    attributes:
      value: |
        Checklist: check `src/catalog.ts` anchors, add a unit fixture, re-run **Catalog sync** with `force=true`.
